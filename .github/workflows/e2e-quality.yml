name: E2E Quality

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master, develop]
  schedule:
    - cron: "0 2 * * *"

jobs:
  smoke:
    name: E2E Smoke
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run content and surface guards
        run: bun run qa:all

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run smoke E2E suite
        run: bun run test:e2e:smoke

      - name: Run Lighthouse quality gate
        run: bun run qa:lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: test-results/lighthouse/*.json

  full-desktop:
    name: E2E Full Desktop
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: smoke
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright desktop browsers
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Run desktop E2E suite
        run: bun run test:e2e:desktop

  full-mobile:
    name: E2E Full Mobile
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: smoke
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright mobile browsers
        run: bunx playwright install --with-deps chromium webkit

      - name: Run mobile E2E suite
        run: bun run test:e2e:mobile

  flake:
    name: E2E Flake Detection
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run flake-detection suite
        run: bun run test:e2e:flake
